name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: cargo build --release --target aarch64-apple-darwin
      - run: cargo build --release --target x86_64-apple-darwin
      - name: Package universal binary
        run: |
          mkdir dist
          lipo -create -output dist/lazyprune \
            target/aarch64-apple-darwin/release/lazyprune \
            target/x86_64-apple-darwin/release/lazyprune
          tar -czf "lazyprune-${GITHUB_REF_NAME}-universal-apple-darwin.tar.gz" -C dist lazyprune
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: lazyprune-*.tar.gz

  github-release:
    needs: [publish, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: macos
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: lazyprune-*.tar.gz

  homebrew:
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: macos
      - uses: actions/checkout@v7
        with:
          repository: ThibaultJRD/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Update formula
        run: |
          ARCHIVE="lazyprune-${GITHUB_REF_NAME}-universal-apple-darwin.tar.gz"
          SHA256=$(sha256sum "$ARCHIVE" | cut -d' ' -f1)
          mkdir -p tap/Formula
          cat > tap/Formula/lazyprune.rb <<EOF
          class Lazyprune < Formula
            desc "TUI to find and delete heavy cache/dependency directories"
            homepage "https://github.com/ThibaultJRD/lazyprune"
            url "https://github.com/ThibaultJRD/lazyprune/releases/download/${GITHUB_REF_NAME}/${ARCHIVE}"
            sha256 "${SHA256}"
            license "MIT"

            depends_on :macos

            def install
              bin.install "lazyprune"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/lazyprune --version")
            end
          end
          EOF
      - name: Push formula
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/lazyprune.rb
          git commit -m "lazyprune ${GITHUB_REF_NAME#v}"
          git push
