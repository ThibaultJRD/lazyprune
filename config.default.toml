root = "~"
# Directories to skip during scan.
# Simple names (e.g. "Library") match any directory with that name.
# Paths with "/" (e.g. ".local/share/Steam") match by relative path from root.
# Hidden entries (dot-prefixed) only matter with --hidden, since hidden dirs
# are already skipped by default.
skip = [
    ".Trash",
    "Library",
    "Applications",
    ".local/share/Steam",
    ".rustup",
    ".cargo",
    ".nvm",
    ".volta",
    ".asdf",
    ".cocoapods",
    ".pub-cache",
    ".m2",
    ".docker",
    ".orbstack",
]

# Targets:
# - dirs: directory names searched for while walking (nested like ".yarn/cache" work)
# - indicator: file(s), one of which must exist in the project dir for a `dirs` match
# - paths: fixed locations (e.g. global caches) checked directly, never walked;
#   shown only when under the scan root, missing ones are ignored

[[targets]]
name = "node_modules"
dirs = ["node_modules"]
indicator = "package.json"

[[targets]]
name = "Pods"
dirs = ["Pods"]
indicator = "Podfile"

[[targets]]
name = "Gradle cache"
dirs = [".gradle", "build"]
indicator = ["build.gradle", "build.gradle.kts"]

[[targets]]
name = "pnpm store"
dirs = [".pnpm-store"]
paths = ["~/Library/pnpm/store", "~/.local/share/pnpm/store"]

[[targets]]
name = "Yarn cache"
dirs = [".yarn/cache"]
indicator = ".yarnrc.yml"
paths = ["~/.yarn/berry/cache", "~/Library/Caches/Yarn", "~/.cache/yarn"]

[[targets]]
name = "Next.js build"
dirs = [".next"]
indicator = ["next.config.js", "next.config.mjs", "next.config.ts"]

[[targets]]
name = "Nuxt build"
dirs = [".nuxt"]
indicator = ["nuxt.config.ts", "nuxt.config.js"]

[[targets]]
name = "Rust target"
dirs = ["target"]
indicator = "Cargo.toml"

[[targets]]
name = "dist"
dirs = ["dist"]
indicator = "package.json"

# --- Global caches (re-downloaded or rebuilt on demand) ---
# Mac and Linux locations side by side

[[targets]]
name = "npm cache"
paths = ["~/.npm/_cacache"]

[[targets]]
name = "pnpm cache"
paths = ["~/Library/Caches/pnpm", "~/.cache/pnpm"]

[[targets]]
name = "Bun cache"
paths = ["~/.bun/install/cache"]

[[targets]]
name = "Cargo cache"
paths = ["~/.cargo/registry", "~/.cargo/git"]

[[targets]]
name = "Homebrew cache"
paths = ["~/Library/Caches/Homebrew", "~/.cache/Homebrew"]

[[targets]]
name = "CocoaPods cache"
paths = ["~/Library/Caches/CocoaPods"]

[[targets]]
name = "Xcode DerivedData"
paths = ["~/Library/Developer/Xcode/DerivedData"]

# --- Ports mode ---
[ports]
# Only show ports matching these ranges on startup (toggle with 'a' in TUI)
dev_filter_enabled = true
# Port ranges to show when dev filter is active (supports "PORT" and "START-END")
dev_filter = ["3000-3009", "4000-4009", "5173-5174", "8080-8090"]
